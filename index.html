<div id="root"></div>
<script>
(() => {
  let replaying = false;
  document.addEventListener('click', (event) => {
    if (replaying) return;
    const entry = event.target.closest?.('.entry');
    if (!entry || entry.classList.contains('leaving')) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    entry.classList.add('leaving');
    window.setTimeout(() => {
      replaying = true;
      entry.click();
      replaying = false;
    }, 700);
  }, true);
})();
</script>
