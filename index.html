<style>
html.booting,html.booting body{background:#070709}html.booting #root{min-height:100vh}.boot-intro{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#070709;color:#fff;font-family:monospace;opacity:1;pointer-events:auto;transition:opacity .32s ease,visibility .32s ease}.boot-intro.hidden{opacity:0;visibility:hidden;pointer-events:none}.boot-intro-inner{display:flex;flex-direction:column;align-items:center;gap:12px}.boot-intro-star{font-size:18px;opacity:.7}.boot-intro-bar{width:min(280px,55vw);height:2px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}.boot-intro-bar::before{content:"";position:absolute;inset:0;width:35%;background:#fff;animation:bootProgress 1.1s ease-in-out infinite}.boot-intro-sub{font-size:11px;letter-spacing:.14em;text-transform:lowercase;opacity:.55}@keyframes bootProgress{0%{transform:translateX(-100%)}100%{transform:translateX(285%)}}
.contact-icon{width:42px!important;height:42px!important;min-width:42px!important;min-height:42px!important;padding:0!important;margin:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;display:grid!important;place-items:center!important;overflow:visible!important}.contact-icon.discord-icon img{content:url("https://i.imgur.com/xEzo1tx.png");width:42px!important;height:42px!important;object-fit:contain;display:block}.contact-icon:not(.discord-icon) svg{display:none}.contact-grid .contact-card:nth-child(2) .contact-icon::before{display:none!important;content:none!important}.contact-grid .contact-card:nth-child(2) .contact-icon::after{content:"";display:block;width:42px;height:42px;background:url("https://www.pixsector.com/cache/dc0ee776/avd5c445f01ca4712be88.png") center/contain no-repeat;filter:invert(1)}
</style>
</head>
<body>
<div id="boot-intro" class="boot-intro" aria-hidden="true"><div class="boot-intro-inner"><div class="boot-intro-star">✦</div><div class="boot-intro-bar" role="progressbar" aria-label="Loading"></div><div class="boot-intro-sub">loading interface…</div></div></div>
<div id="root"></div>
<script>
(() => {
  const boot=document.getElementById('boot-intro');
  const reveal=()=>{if(!boot)return;boot.classList.add('hidden');document.documentElement.classList.remove('booting');setTimeout(()=>boot.remove(),350)};
  const observer=new MutationObserver(()=>{if(document.querySelector('.entry,.site')){observer.disconnect();requestAnimationFrame(reveal)}});
  observer.observe(document.getElementById('root'),{childList:true,subtree:true});
  let replaying=false;
  document.addEventListener('click',(event)=>{if(replaying)return;const entry=event.target.closest?.('.entry');if(!entry||entry.classList.contains('leaving'))return;event.preventDefault();event.stopImmediatePropagation();entry.classList.add('leaving');window.setTimeout(()=>{replaying=true;entry.click();replaying=false},320)},true);
  document.addEventListener('click',(event)=>{const recent=event.target.closest?.('.recent-card,.recent-scroller,.recent-carousel,.np-bottom');if(!recent)return;event.preventDefault();event.stopImmediatePropagation()},true);
})();
</script>
